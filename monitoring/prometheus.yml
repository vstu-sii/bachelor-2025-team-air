global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'recruitment-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics
    
  - job_name: 'recruitment-db'
    static_configs:
      - targets: ['db:5432']
    
  - job_name: 'recruitment-llm'
    static_configs:
      - targets: ['llm-service:5001']
    
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
